<style>
/* Layout: one-screen swipe deck. Header + filters, card stack fills the middle, big thumb buttons at the bottom. Wishlist tab is a scrolling grid. */
:root{
  --bg:#e9edf3; --surface:#ffffff; --ink:#151a24; --muted:#5b6577; --line:#d3d9e3;
  --brick:#f5c518; --brick-ink:#2a2100; --yay:#1f9d55; --nay:#d6453d; --photo:#ffffff;
  --shadow:0 10px 30px rgba(21,26,36,.14);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#1a202b; --ink:#eef1f6; --muted:#9aa4b6; --line:#2c3443;
  --brick:#f5c518; --brick-ink:#2a2100; --yay:#34c274; --nay:#ef5f57; --photo:#f4f5f7;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#1a202b; --ink:#eef1f6; --muted:#9aa4b6; --line:#2c3443;
  --brick:#f5c518; --brick-ink:#2a2100; --yay:#34c274; --nay:#ef5f57; --photo:#f4f5f7;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
button,select,a,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hint{display:none;text-align:center;font-size:12px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.hint{display:block}.card{cursor:grab}.card:active{cursor:grabbing}}
@media (pointer:coarse){select{font-size:16px}}
@media (min-width:900px){.deck{max-height:640px}.app{padding-block:24px}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:12px}
.narrow{width:100%;max-width:460px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px}
.stud{width:22px;height:14px;background:var(--brick);border-radius:3px;position:relative;flex:none}
.stud::before,.stud::after{content:"";position:absolute;top:-4px;width:6px;height:4px;background:var(--brick);border-radius:2px 2px 0 0}
.stud::before{left:3px}.stud::after{right:3px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{font:600 13px var(--f-body);border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
select{font:500 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#theme{flex:1;min-width:0;max-width:220px}
.from{display:flex;align-items:center;gap:6px}
.tally{margin-left:auto;display:flex;gap:10px;font-variant-numeric:tabular-nums}
.tally b{font-family:var(--f-mono);font-weight:700}
.tally .y b{color:var(--yay)}.tally .n b{color:var(--nay)}
.status{font-size:12px;color:var(--muted);min-height:1em}

.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
.card.back{transform:scale(.95) translateY(10px);opacity:.7;pointer-events:none}
.card.fly{transition:transform .28s ease-out, opacity .28s ease-out}
.card.snap{transition:transform .2s ease-out}
.photo{flex:1;min-height:0;background:var(--photo);display:flex;align-items:center;justify-content:center;position:relative}
.photo img{max-width:92%;max-height:92%;object-fit:contain;pointer-events:none}
.ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:#4a5262;text-align:center;padding:16px}
.ph .num{font:700 44px var(--f-mono);color:#151a24;letter-spacing:-.02em}
.bricks{display:flex;gap:6px}
.bricks i{width:26px;height:16px;border-radius:3px;display:block}
.ph a{font:600 14px var(--f-body);color:#151a24;background:var(--brick);padding:8px 14px;border-radius:999px;text-decoration:none}
.stamp{position:absolute;top:18px;font:800 30px var(--f-display);letter-spacing:.04em;padding:2px 12px;border:4px solid;border-radius:10px;opacity:0;background:rgba(255,255,255,.85)}
.stamp.y{left:18px;color:#1f9d55;transform:rotate(-12deg)}
.stamp.n{right:18px;color:#d6453d;transform:rotate(12deg)}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{font:700 12px var(--f-mono);background:var(--brick);color:var(--brick-ink);padding:2px 7px;border-radius:5px}
.name{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15;margin:0;text-wrap:balance}
.facts{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;align-items:center;flex-wrap:wrap}
.facts b{color:var(--ink);font-weight:600}
.facts a{color:var(--ink);font-weight:600;margin-left:auto}

.controls{display:flex;justify-content:center;align-items:center;gap:22px;padding-bottom:4px}
.btn{width:66px;height:66px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.btn svg{width:28px;height:28px}
.btn.nay{color:var(--nay)}.btn.yay{color:var(--yay)}
.btn.undo{width:48px;height:48px;color:var(--muted)}
.btn.undo svg{width:20px;height:20px}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,label.file:focus-within{outline:3px solid var(--brick);outline-offset:2px}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--muted);padding:20px}
.empty h2{font-family:var(--f-display);color:var(--ink);margin:0;font-size:22px}

.listview{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.lhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:600 14px var(--f-body);padding:7px 14px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.lhead select{margin-left:auto}
.summary{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.summary b{color:var(--ink)}
.io{display:flex;gap:8px;flex-wrap:wrap}
.io button,.io label.file{flex:1;min-width:140px;text-align:center;font:600 14px var(--f-body);padding:11px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.io .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.io input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pending{background:var(--surface);border:1px solid var(--brick);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.pending .row{display:flex;gap:8px;flex-wrap:wrap}
.pending button{flex:1;font:600 14px var(--f-body);padding:9px;border-radius:9px;border:0;cursor:pointer;color:#fff}
.pending .py{background:var(--yay)}.pending .pn{background:var(--nay)}
.pending .pc{background:none;color:var(--muted);border:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.gphoto{aspect-ratio:4/3;max-width:100%;background:var(--photo);display:grid;place-items:center;font:700 22px var(--f-mono);color:#151a24}
.gphoto img{max-width:90%;max-height:90%;object-fit:contain}
.gbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.gbody .nm{font-weight:600;font-size:14px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gbody small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.gacts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.gacts a,.gacts button{flex:1;font:600 12px var(--f-body);text-align:center;text-decoration:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 4px;cursor:pointer}
.gacts button{color:var(--muted)}
.none{color:var(--muted);text-align:center;padding:32px 0;grid-column:1/-1}
@media (prefers-reduced-motion: reduce){.card.fly,.card.snap{transition:none}}
</style>

        <option value="big">Most pieces</option>
        <option value="small">Fewest pieces</option>

  </section>
  <div class="status narrow" id="status"></div>
</div>

<script>
(function(){
const RAW = JSON.parse(document.getElementById('sets').textContent);
const SETS = RAW.s.map(r=>({id:r[0],n:r[1],y:r[2],t:RAW.th[r[3]],s:r[4]<0?'':RAW.th[r[4]],p:r[5]}));
const BY = Object.fromEntries(SETS.map(s=>[s.id,s]));
const IMG = id=>`https://cdn.rebrickable.com/media/sets/${id}-1.jpg`;
const $ = id=>document.getElementById(id);
const swipes = new Map(); // id -> {v, at, n?, t?, p?, y?}
const history = [];
let col=null, filter='', minYear=2025, order=[], listMode='yay';
const LS='brickswipe.v1', LSY='brickswipe.year';

function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LS)||'{}');for(const k in o)swipes.set(k,o[k]);}catch(e){}
  try{const y=parseInt(localStorage.getItem(LSY),10);if(y)minYear=y;}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(Object.fromEntries(swipes)));}catch(e){}}
function info(id){const s=BY[id];if(s)return s;const x=swipes.get(id)||{};return {id,n:x.n||`Set ${id}`,t:x.t||'',s:'',p:x.p||0,y:x.y||''};}

order = SETS.map(s=>s.id);
for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}

// filters
const years=[...new Set(SETS.map(s=>s.y))].sort((a,b)=>b-a);
if(!years.includes(minYear))minYear=years[1]||years[0];
$('year').innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');
$('year').value=minYear;
$('year').onchange=()=>{minYear=+$('year').value;try{localStorage.setItem(LSY,minYear);}catch(e){}buildThemes();render();};
function buildThemes(){
  const counts={};SETS.forEach(s=>{if(s.y>=minYear&&!swipes.has(s.id))counts[s.t]=(counts[s.t]||0)+1;});
  if(filter&&!counts[filter])counts[filter]=0;
  $('theme').innerHTML='<option value="">All themes</option>'+Object.keys(counts).sort().map(t=>`<option value="${esc(t)}">${esc(t)} (${counts[t]})</option>`).join('');
  $('theme').value=filter;
}
$('theme').onchange=()=>{filter=$('theme').value;render();};

function queue(){return order.filter(id=>!swipes.has(id)&&BY[id].y>=minYear&&(!filter||BY[id].t===filter));}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(n){return Number(n).toLocaleString('en-US');}
const BRICKS=['#d6453d','#f5c518','#1f6fd1','#1f9d55'];

function cardHTML(s){
  const sub=s.s?` › ${esc(s.s)}`:'';
  return `<div class="photo"><img alt="" src="${IMG(s.id)}" referrerpolicy="no-referrer">
    <div class="ph" hidden><div class="bricks">${BRICKS.map(c=>`<i style="background:${c}"></i>`).join('')}</div>
    <div class="num">${s.id}</div><a href="https://rebrickable.com/sets/${s.id}-1/" target="_blank" rel="noopener">See photo ↗</a></div>
    <span class="stamp y">YAY</span><span class="stamp n">NAY</span></div>
    <div class="info"><div class="meta"><span class="chip">${s.id}</span><span>${esc(s.t)}${sub}</span></div>
    <h2 class="name">${esc(s.n)}</h2>
    <div class="facts"><span><b>${fmt(s.p)}</b> pcs</span><span>${s.y}</span>
    <a href="https://www.lego.com/en-us/search?q=${s.id}" target="_blank" rel="noopener">Price on LEGO.com ↗</a></div></div>`;
}
function wireImg(el){
  const img=el.querySelector('img'),ph=el.querySelector('.ph');
  const fail=()=>{img.hidden=true;ph.hidden=false;};
  img.addEventListener('error',fail);
  if(img.complete&&img.naturalWidth===0)fail();
}

function tally(){let y=0,n=0;swipes.forEach(v=>v.v==='yay'?y++:n++);$('cy').textContent=y;$('cn').textContent=n;return{y,n};}
function render(){
  const q=queue();tally();
  $('left').textContent=`${fmt(q.length)} left`;
  $('bUndo').disabled=!history.length;
  $('bYay').disabled=$('bNay').disabled=!q.length;
  const deck=$('deck');deck.innerHTML='';
  if(!q.length){deck.innerHTML=`<div class="empty"><h2>Deck cleared</h2><div>${filter?'Nothing left in this theme. Pick another one up top.':'Nothing left from '+minYear+' on. Pick an earlier year or check your wishlist.'}</div></div>`;return;}
  q.slice(0,2).reverse().forEach((id,i,arr)=>{
    const el=document.createElement('div');el.className='card'+(i===0&&arr.length===2?' back':'');
    el.dataset.id=id;el.innerHTML=cardHTML(BY[id]);deck.appendChild(el);wireImg(el);
  });
  q.slice(2,6).forEach(id=>{const im=new Image();im.referrerPolicy='no-referrer';im.src=IMG(id);});
  drag(deck.lastElementChild);
}

function drag(el){
  let sx=0,sy=0,dx=0,on=false,t0=0;
  const ys=el.querySelector('.stamp.y'),ns=el.querySelector('.stamp.n');
  el.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;on=true;sx=e.clientX;sy=e.clientY;t0=Date.now();el.classList.remove('snap');el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;const dy=e.clientY-sy;
    el.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/18}deg)`;
    ys.style.opacity=Math.max(0,Math.min(1,dx/90));ns.style.opacity=Math.max(0,Math.min(1,-dx/90));});
  const end=()=>{if(!on)return;on=false;const v=Math.abs(dx)/Math.max(1,Date.now()-t0);
    if(Math.abs(dx)>110||(v>.6&&Math.abs(dx)>40))decide(dx>0?'yay':'nay',el);
    else{el.classList.add('snap');el.style.transform='';ys.style.opacity=0;ns.style.opacity=0;}dx=0;};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

let busy=false;
function decide(v,el){
  if(busy)return;el=el||$('deck').lastElementChild;if(!el||!el.dataset.id)return;busy=true;
  const id=el.dataset.id;
  el.querySelector(v==='yay'?'.stamp.y':'.stamp.n').style.opacity=1;
  el.classList.add('fly');el.style.transform=`translate(${v==='yay'?'':'-'}140%,40px) rotate(${v==='yay'?24:-24}deg)`;el.style.opacity=0;
  swipes.set(id,{v,at:new Date().toISOString()});history.push(id);lsSave();put(id);
  setTimeout(()=>{busy=false;render();},220);
}
function backToDeck(id){
  swipes.delete(id);const h=history.lastIndexOf(id);if(h>-1)history.splice(h,1);
  order=[id,...order.filter(x=>x!==id)];lsSave();del(id);
}
function undo(){const id=history[history.length-1];if(!id)return;backToDeck(id);buildThemes();render();}

async function put(id){if(!col)return;try{await col.doc(id).set(swipes.get(id));}catch(e){note('Could not save to your account. It is kept on this device.');}}
async function del(id){if(!col)return;try{await col.doc(id).delete();}catch(e){note('Could not update your account. Try again in a moment.');}}
function note(t){$('status').textContent=t;}

// ---- CSV ----
function csvCell(c){c=c==null?'':String(c);return /[",\r\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}
function buildCsv(){
  const rows=[['set_number','status','name','theme','subtheme','pieces','year','swiped_at']];
  [...swipes].sort((a,b)=>(a[1].v===b[1].v?0:a[1].v==='yay'?-1:1)||(a[1].at<b[1].at?-1:1)).forEach(([id,x])=>{
    const s=info(id);rows.push([id,x.v,s.n,s.t,s.s,s.p||'',s.y,x.at]);});
  return rows.map(r=>r.map(csvCell).join(',')).join('\n')+'\n';
}
async function exportCsv(){
  if(!swipes.size){note('Nothing to export yet. Swipe a few sets first.');return;}
  const data=buildCsv(),filename='lego-swipes.csv';
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(dl){try{await dl.save({filename,data});note(`Saved ${filename}`);}catch(e){note(e&&e.code==='declined'?'Export cancelled.':'Export did not go through. Try again.');}return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();note(`Saved ${filename}`);}catch(e){note('Export is not available here.');}
}
function parseCsv(text){
  const rows=[];let row=[],cell='',q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function normId(v){v=String(v||'').trim().replace(/^#/,'');const m=v.match(/^(\d{3,7})(?:-\d+)?$/);return m?m[1]:null;}
function normStatus(v){v=String(v||'').trim().toLowerCase();
  if(['yay','yes','y','want','wishlist','like','liked','1','true','right'].includes(v))return'yay';
  if(['nay','no','n','pass','skip','dislike','0','false','left'].includes(v))return'nay';return null;}
let pendingImport=null;
$('imp').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let rows;try{rows=parseCsv(await f.text());}catch(err){note(`Could not read ${f.name}. Make sure it is a .csv file.`);return;}
  if(!rows.length){note(`${f.name} is empty.`);return;}
  const h=rows[0].map(c=>c.trim().toLowerCase());
  const hasHeader=h.some(c=>/set|status|name|number|swipe/.test(c))&&!normId(rows[0][0]);
  const ci=hasHeader?Math.max(0,h.findIndex(c=>/^set(_|\s)?(num|number|no|id)?$|^number$|^set$/.test(c))):0;
  const si=hasHeader?h.findIndex(c=>/^(status|swipe|list|vote|choice)$/.test(c)):-1;
  const ai=hasHeader?h.findIndex(c=>/swiped_?at|date|time/.test(c)):-1;
  const ni=hasHeader?h.findIndex(c=>c==='name'):-1, ti=hasHeader?h.findIndex(c=>c==='theme'):-1;
  const pi=hasHeader?h.findIndex(c=>/^pieces?$|^parts$/.test(c)):-1, yi=hasHeader?h.findIndex(c=>c==='year'):-1;
  const fileGuess=/nay|no|pass/i.test(f.name)?'nay':/yay|yes|want|wish/i.test(f.name)?'yay':null;
  const items=[];let skipped=0;
  rows.slice(hasHeader?1:0).forEach(r=>{const id=normId(r[ci]);if(!id){skipped++;return;}
    const it={id,v:si>=0?normStatus(r[si]):null,at:ai>=0&&r[ai]?r[ai].trim():new Date().toISOString()};
    if(!BY[id]){if(ni>=0&&r[ni])it.n=r[ni];if(ti>=0&&r[ti])it.t=r[ti];if(pi>=0&&+r[pi])it.p=+r[pi];if(yi>=0&&+r[yi])it.y=+r[yi];}
    items.push(it);});
  if(!items.length){note(`No set numbers found in ${f.name}. The file needs a column of set numbers like 10342 or 10342-1.`);return;}
  const missing=items.filter(i=>!i.v).length;
  pendingImport={items,skipped,name:f.name};
  if(!missing){applyImport(null);return;}
  const p=$('pending');p.hidden=false;
  p.innerHTML=`<div><b>${esc(f.name)}</b>: ${items.length} sets${missing<items.length?`, ${missing} without a yay/nay`:', no yay/nay column'}. Add ${missing<items.length?'those':'them'} as:</div>
    <div class="row"><button class="py" data-v="yay">Yay</button><button class="pn" data-v="nay">Nay</button><button class="pc" data-v="">Cancel</button></div>`;
  if(fileGuess)p.querySelector(`[data-v="${fileGuess}"]`).focus();
});
$('pending').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('pending').hidden=true;
  if(!b.dataset.v){pendingImport=null;note('Import cancelled.');return;}applyImport(b.dataset.v);});
async function applyImport(fallback){
  const {items,skipped,name}=pendingImport;pendingImport=null;
  let added=0,changed=0;const ids=[];
  items.forEach(it=>{const v=it.v||fallback;const prev=swipes.get(it.id);
    if(prev&&prev.v===v)return;if(prev)changed++;else added++;
    const rec={v,at:it.at};['n','t','p','y'].forEach(k=>{if(it[k]!=null)rec[k]=it[k];});
    swipes.set(it.id,rec);ids.push(it.id);});
  lsSave();buildThemes();renderList();
  let msg=`Imported ${name}: ${added} new, ${changed} changed`;if(skipped)msg+=`, ${skipped} rows skipped`;
  note(msg+'.');
  if(col&&ids.length){let done=0,fail=0;for(const id of ids){try{await col.doc(id).set(swipes.get(id));}catch(e){fail++;}done++;
      if(done%25===0)note(`${msg}. Syncing ${done}/${ids.length}…`);}
    note(fail?`${msg}. ${fail} didn't sync to your account, they're kept on this device.`:msg+'.');}
}

// ---- wishlist ----
function renderList(){
  const sort=$('sort').value;
  let items=[...swipes].filter(([,x])=>x.v===listMode).map(([id,x])=>({...info(id),at:x.at}));
  const by={new:(a,b)=>a.at<b.at?1:-1,old:(a,b)=>a.at<b.at?-1:1,theme:(a,b)=>a.t.localeCompare(b.t)||a.n.localeCompare(b.n),
    big:(a,b)=>b.p-a.p,small:(a,b)=>a.p-b.p,year:(a,b)=>(b.y||0)-(a.y||0)}[sort];
  items.sort(by);
  const pcs=items.reduce((t,s)=>t+(+s.p||0),0);
  const themes=new Set(items.map(s=>s.t).filter(Boolean)).size;
  $('summary').innerHTML=items.length?`<b>${fmt(items.length)}</b> sets · <b>${fmt(pcs)}</b> pieces · ${themes} theme${themes===1?'':'s'}`:'';
  $('list').innerHTML=items.length?items.map(s=>`<li class="gcard">
    <div class="gphoto"><img alt="" src="${IMG(s.id)}" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${s.id}'))"></div>
    <div class="gbody"><div class="nm">${esc(s.n)}</div><small>${s.id} · ${esc(s.t)}${s.y?' · '+s.y:''}</small><small>${s.p?fmt(s.p)+' pcs':''}</small>
    <div class="gacts"><a href="https://www.lego.com/en-us/search?q=${s.id}" target="_blank" rel="noopener">LEGO.com ↗</a><button data-id="${s.id}">${listMode==='yay'?'Remove':'Undo'}</button></div></div></li>`).join('')
    :`<li class="none">${listMode==='yay'?'No yays yet. Swipe right on sets you want, or import a CSV.':'No nays yet.'}</li>`;
}
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;backToDeck(b.dataset.id);buildThemes();tally();renderList();note('Sent back to the deck.');});
$('sort').onchange=renderList;
function tab(which){
  const sw=which==='swipe';$('tabSwipe').setAttribute('aria-selected',sw);$('tabList').setAttribute('aria-selected',!sw);
  $('swipeView').hidden=!sw;$('listView').hidden=sw;
  if(sw){buildThemes();render();}else renderList();
}
$('tabSwipe').onclick=()=>tab('swipe');$('tabList').onclick=()=>tab('list');
function seg(m){listMode=m;$('sY').setAttribute('aria-selected',m==='yay');$('sN').setAttribute('aria-selected',m==='nay');renderList();}
$('sY').onclick=()=>seg('yay');$('sN').onclick=()=>seg('nay');
$('xAll').onclick=exportCsv;
$('bYay').onclick=()=>decide('yay');$('bNay').onclick=()=>decide('nay');$('bUndo').onclick=undo;
document.addEventListener('keydown',e=>{if($('swipeView').hidden||/SELECT|INPUT/.test(e.target.tagName))return;
  if(e.key==='ArrowRight')decide('yay');else if(e.key==='ArrowLeft')decide('nay');else if((e.key==='z'||e.key==='Z')&&(e.metaKey||e.ctrlKey))undo();});

// boot: this device first, then account
lsLoad();$('year').value=minYear;buildThemes();render();
if(!(window.claude&&window.claude.use)){note('Swipes are saved in this browser.');}
else (async()=>{
  try{
    const [dbns,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!dbns||!user){note('Swipes are saved on this device only.');return;}
    const uid=await user.id();col=dbns.collection('data/users/'+uid+'/swipes');
    const remote=new Map();let last=null;
    for(let page=0;page<40;page++){
      let q=col.orderBy('at');if(last!==null)q=q.where('at','>',last);
      const snap=await q.limit(1000).get();
      snap.docs.forEach(d=>{const x=d.data();if(x&&x.v){remote.set(d.id,x);last=x.at;}});
      if(snap.size<1000)break;
    }
    const localOnly=[...swipes.keys()].filter(k=>!remote.has(k));
    remote.forEach((x,k)=>swipes.set(k,x));lsSave();
    for(const k of localOnly){try{await col.doc(k).set(swipes.get(k));}catch(e){}}
    note('Swipes sync to your account.');
    if($('listView').hidden){buildThemes();render();}else renderList();
  }catch(e){note('Could not reach your account. Swipes are saved on this device for now.');}
})();
})();
</script>
